<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calculator.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Project</title>
</head>
<body>
  <div id="calculator">
    <input type="text" id="text" name="display" readonly>   
    <div class="button-container">
    <button class="button-class"onclick="currentDisplay = '';
    document.querySelector('#text').value=currentDisplay;">C</button>
    <button class="button-class" onclick="currentDisplay = currentDisplay + '1';
    document.querySelector('#text').value=currentDisplay;">1</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '2';
    document.querySelector('#text').value=currentDisplay;">2</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '+';
    document.querySelector('#text').value=currentDisplay;">+</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '3';
    document.querySelector('#text').value=currentDisplay;">3</button>


    <button class="button-class"onclick="currentDisplay = currentDisplay + '4';
    document.querySelector('#text').value=currentDisplay;">4</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '-';
    document.querySelector('#text').value=currentDisplay;">-</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '5';
    document.querySelector('#text').value=currentDisplay;">5</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '6';
    document.querySelector('#text').value=currentDisplay;">6</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '*';
    document.querySelector('#text').value=currentDisplay;">*</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '7';
    document.querySelector('#text').value=currentDisplay;">7</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '8';
    document.querySelector('#text').value=currentDisplay;">8</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '/';
    document.querySelector('#text').value=currentDisplay;">/</button>

    <button class="button-class"onclick="
    let result=eval(currentDisplay);
    currentDisplay = result;
    document.querySelector('#text').value=currentDisplay;">=</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '9';
    document.querySelector('#text').value=currentDisplay;">9</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '0';
    document.querySelector('#text').value=currentDisplay;">0</button>

    <button class="button-class"onclick="currentDisplay = currentDisplay + '.';
    document.querySelector('#text').value=currentDisplay;">.</button>
  </div>
  </div>
  <script>
    let currentDisplay='';
    document.querySelector('#text').value=currentDisplay;
  </script>
</body>
</html>
